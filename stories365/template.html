<!doctype html><html><head><meta charset="utf-8"><style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
*{margin:0;box-sizing:border-box}
body{width:1080px;height:1920px;background:#111418;color:#F4F1EA;font-family:Inter,Arial,sans-serif;padding:150px 96px 140px;display:flex;flex-direction:column}
.tag{font-size:34px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#E8B04B}
.date{font-size:30px;color:#9AA0A6;margin-top:16px}
.bar{width:120px;height:10px;background:#E8B04B;margin:80px 0 70px}
.theme{font-size:40px;font-weight:600;color:#C9CDD2;margin-bottom:48px;line-height:1.25}
h1{font-size:76px;font-weight:800;line-height:1.14;letter-spacing:-.01em}
p{font-size:42px;line-height:1.45;color:#C9CDD2;margin-top:60px}
.foot{margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end;font-size:34px}
.foot b{color:#F4F1EA}.foot span{color:#9AA0A6}
</style></head><body>
<div class="tag">365 Insights de Varejo</div>
<div class="date">{{DATA}}</div>
<div class="bar"></div>
<div class="theme">{{TEMA}}</div>
<h1>{{TITULO}}</h1>
<p>{{TEXTO}}</p>
<div class="foot"><b>@varejocombarreto</b><span>Dia {{DIA}}</span></div>
</body></html>
